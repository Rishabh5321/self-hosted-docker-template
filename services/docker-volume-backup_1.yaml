services:
  docker-backup-1:
    image: offen/docker-volume-backup:v2
    container_name: docker-volume-backup_1
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "30 19 * * *"
      BACKUP_FILENAME: "docker-backup-%Y-%m-%dT%H-%M-%S.tar.gz"

      TZ: ${TZ}

      # WebDAV Configuration
      WEBDAV_URL: ${WEBDAV_URL_1}
      WEBDAV_PATH: ${WEBDAV_PATH}
      WEBDAV_USERNAME: ${WEBDAV_USERNAME}
      WEBDAV_PASSWORD: ${WEBDAV_PASSWORD}

      BACKUP_RETENTION_DAYS: 2
      BACKUP_STOP_DURING_BACKUP_LABEL: stop

    volumes:
      - ${DOCKER_CONFIG_BASE}/:/backup/Docker:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
