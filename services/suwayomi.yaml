services:
  suwayomi: # Tachidesk service
    image: ghcr.io/suwayomi/tachidesk:preview
    container_name: suwayomi
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - FLARESOLVERR_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191
    ports:
      - 4567:4567
    volumes:
      - ${DOCKER_CONFIG_BASE}/Suwayomi_Config:/home/suwayomi/.local/share/Tachidesk
    labels:
      - "glance.name=Suwayomi"
      - "glance.icon=https://cdn.jsdelivr.net/gh/selfhst/icons/webp/suwayomi.webp"
      - "glance.url=http://suwayomi.${BASE_DOMAIN}/"
      - "glance.description=Manga Server"
      - "glance.id=suwayomi"
      - "docker-volume-backup.stop-during-backup=stop"
      - "traefik.enable=true"
      - "traefik.http.routers.suwayomi.rule=Host(`suwayomi.${BASE_DOMAIN}`)"
      - "traefik.http.routers.suwayomi.entrypoints=web"
      - "traefik.http.services.suwayomi.loadbalancer.server.port=4567"
      - "traefik.http.routers.suwayomi.middlewares=tinyauth"
    networks:
      - proxy_network
    depends_on:
      - flaresolverr
    restart: unless-stopped
